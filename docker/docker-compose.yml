version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dta-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dta_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dta} -d ${POSTGRES_DB:-dta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dta-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dta-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-dta}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-dta_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${PORT:-3004}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:3000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # EVA / Ollama. En despliegue server-side esto será http://localhost:11434
      # (backend y Ollama en el mismo host). En dev local apunta al Ollama del host.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Integration Hub (SOLO LECTURA). Vacías = 'pendiente_credenciales'.
      # Oben rellena estas en docker/.env para activar cada integración.
      VETA_BASE_URL: ${VETA_BASE_URL:-}
      VETA_API_KEY: ${VETA_API_KEY:-}
      VETA_API_KEY_HEADER: ${VETA_API_KEY_HEADER:-x-api-key}
      NETSUITE_ACCOUNT_ID: ${NETSUITE_ACCOUNT_ID:-}
      NETSUITE_CONSUMER_KEY: ${NETSUITE_CONSUMER_KEY:-}
      NETSUITE_CONSUMER_SECRET: ${NETSUITE_CONSUMER_SECRET:-}
      NETSUITE_TOKEN_ID: ${NETSUITE_TOKEN_ID:-}
      NETSUITE_TOKEN_SECRET: ${NETSUITE_TOKEN_SECRET:-}
      ARMSTRONG_BASE_URL: ${ARMSTRONG_BASE_URL:-}
      ARMSTRONG_TOKEN: ${ARMSTRONG_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is baked into the client bundle and consumed by the
        # browser on the host, so it must point to a host-reachable URL — NOT
        # the docker-internal hostname "backend". For remote deploy, override
        # this with the address the client's browser uses to reach the backend.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3004}
    container_name: dta-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3004}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: